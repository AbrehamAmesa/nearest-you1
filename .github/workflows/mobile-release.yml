name: Nearest You Mobile Release (Android & iOS)

on:
  push:
    tags:
      - 'mobile-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version tag (e.g. mobile-v1.0.0)'
        required: true
        default: 'mobile-v1.0.0'
      api_base_url:
        description: 'Backend API Base URL baked into build (overrides repo var API_BASE_URL)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Analyze & Unit Test (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project & run tests
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  build-android:
    name: Build Android (APK & AAB)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android Gradle wrapper binaries exist
        working-directory: mobile
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create --platforms=android --org com.nearestyou --project-name nearest_you_mobile /tmp/ny_android_tpl
            cp -n /tmp/ny_android_tpl/android/gradlew android/gradlew || true
            cp -n /tmp/ny_android_tpl/android/gradlew.bat android/gradlew.bat || true
            mkdir -p android/gradle/wrapper
            cp -n /tmp/ny_android_tpl/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar || true
            chmod +x android/gradlew
          fi

      - name: Configure Android release signing (if secrets provided)
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=release-keystore.jks
          EOF
            echo "Keystore configured for release signing."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set; building with fallback signing."
          fi

      - name: Build Android APK & AppBundle
        working-directory: mobile
        env:
          INPUT_API_URL: ${{ github.event.inputs.api_base_url }}
          VAR_API_URL: ${{ vars.API_BASE_URL }}
        run: |
          API_URL="${INPUT_API_URL:-$VAR_API_URL}"
          DART_DEFINES=""
          if [ -n "$API_URL" ]; then
            DART_DEFINES="--dart-define=API_BASE_URL=$API_URL"
          fi
          flutter pub get
          flutter build apk --release $DART_DEFINES
          flutter build appbundle --release $DART_DEFINES

      - name: Prepare Android release artifacts
        working-directory: mobile
        run: |
          mkdir -p ../release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../release-artifacts/nearest-you-android.apk
          cp build/app/outputs/bundle/release/app-release.aab ../release-artifacts/nearest-you-android.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/

  build-ios:
    name: Build iOS (IPA)
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch Flutter & CocoaPods dependencies
        working-directory: mobile
        run: |
          flutter pub get
          cd ios && pod install && cd ..

      - name: Build signed IPA (if Apple signing secrets provided) or unsigned IPA
        working-directory: mobile
        env:
          INPUT_API_URL: ${{ github.event.inputs.api_base_url }}
          VAR_API_URL: ${{ vars.API_BASE_URL }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_PLIST: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST }}
        run: |
          API_URL="${INPUT_API_URL:-$VAR_API_URL}"
          DART_DEFINES=""
          if [ -n "$API_URL" ]; then
            DART_DEFINES="--dart-define=API_BASE_URL=$API_URL"
          fi
          mkdir -p ../release-artifacts

          if [ -n "$IOS_CERTIFICATE_BASE64" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            security create-keychain -p "temp_pass" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "temp_pass" "$KEYCHAIN_PATH"

            echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"

            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

            echo "$IOS_EXPORT_OPTIONS_PLIST" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
            flutter build ipa --release $DART_DEFINES --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
            cp build/ios/ipa/*.ipa ../release-artifacts/nearest-you-ios.ipa
          else
            echo "No Apple code-signing secrets configured; building unsigned iOS .ipa archive."
            flutter build ios --release --no-codesign $DART_DEFINES
            mkdir -p build/ios/ipa/Payload
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
            (cd build/ios/ipa && zip -r ../../../release-artifacts/nearest-you-ios-unsigned.ipa Payload)
          fi

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: release-artifacts/

  publish-github-release:
    name: Publish GitHub Release (Android & iOS)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts/

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: artifacts/

      - name: Generate SHA256 Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Nearest You Mobile ${{ steps.tag.outputs.tag_name }}"
          generate_release_notes: true
          files: artifacts/*
