server:
  port: ${PORT:8080}

spring:
  application:
    name: nearest-you-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nearestyou}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Postgres@1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

nearestyou:
  auth:
    super-admin-emails: ${SUPER_ADMIN_EMAILS:abrehamamesw@gmail.com,admin@nearestyou.et}
    allow-dev-headers: ${ALLOW_DEV_AUTH:false}
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
